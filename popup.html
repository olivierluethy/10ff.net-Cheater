<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="getCurrentYear.js" defer></script>
    <script src="popup.js" defer></script>
    <title>10ff.net Cheater</title>
  </head>
  <body>
    <h1>10ff.net Cheater</h1>
    <img
      src="logo.png"
      alt="YouTube Focus Icon"
      width="125"
      height="125"
      style="display: block; margin: 0 auto"
    />

    <label class="switch">
      <input type="checkbox" id="checkbox-subs" checked />
      <span class="slider round"></span>
      <span id="toggOnOff"></span>
    </label>

    <div
      style="text-align: center; margin-top: 1rem"
      title="Click to start the hack!"
    >
      <button id="startHack">Start Hack!</button>
    </div>

    <div id="intSpeed">Current Speed:</div>

    <p style="text-align: center" id="nameYear"></p>
    <hr />
    <div
      style="text-align: center; margin-top: 10px"
      title="Do you want to support my project?"
    >
      <a href="https://buymeacoffee.com/olivierlue8" target="_blank">
        <img
          src="https://cdn.buymeacoffee.com/buttons/v2/default-orange.png"
          alt="Buy Me a Coffee"
          width="125"
          height="30"
        />
      </a>
    </div>
  </body>
</html>
